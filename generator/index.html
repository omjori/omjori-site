<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوّي ملفج الرقمي مجاناً | أم جوري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:#FAF1ED;color:#311118;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.top{text-align:center;margin-bottom:16px}
.top .pill{display:inline-block;background:#fff;color:#E63872;font-weight:700;font-size:13px;padding:5px 14px;border-radius:30px;border:1px solid #F7CFDC}
.top h1{font-size:26px;font-weight:900;margin:10px 0 6px;line-height:1.3}
.top .tag{color:#311118;font-size:16px;font-weight:700;line-height:1.6;background:#fff;border-radius:16px;padding:10px 14px;border:1.5px dashed #F7CFDC}
.card{background:#fff;border-radius:22px;padding:18px 16px;border:1.5px solid #F7CFDC;box-shadow:0 10px 30px rgba(230,56,114,.08)}
label{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;margin:18px 0 8px}
label:first-child{margin-top:0}
label i{font-style:normal;width:24px;height:24px;border-radius:50%;background:#E63872;color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
label small{font-weight:400;color:#9a7580;font-size:12px}
input,textarea{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;border:2px solid #F7CFDC;border-radius:14px;background:#FAF1ED;outline:none;color:#311118}
textarea{resize:none;height:76px;line-height:1.6}
input:focus,textarea:focus{border-color:#E63872;background:#fff}
.chips{display:grid;gap:8px}
.c3{grid-template-columns:1fr 1fr 1fr}.c2{grid-template-columns:1fr 1fr}
.chip{font-family:inherit;font-size:14px;font-weight:700;padding:11px 6px;border-radius:14px;border:2px solid #F7CFDC;background:#fff;color:#7a5560;cursor:pointer;text-align:center;line-height:1.3}
.chip small{display:block;font-weight:400;font-size:11px;color:#9a7580;margin-top:2px}
.chip.on{border-color:#E63872;background:#FFF0F5;color:#E63872}
.th{display:flex;flex-direction:column;width:46px;height:58px;margin:0 auto 7px;border-radius:7px;background:#fff;border:1.5px solid #F7CFDC;overflow:hidden}
.wide .th{width:72px;height:46px}
.chip.on .th{border-color:#E63872}
.th .hd{height:11px;background:#E63872;flex:none}
.th .bd{flex:1;padding:4px;display:flex;flex-direction:column;gap:3px}
.th .g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1}
.th .g4{grid-template-columns:repeat(4,1fr)}
.th .g i{background:#FFF0F5;border:1px solid #F7CFDC}
.th .g i.on{background:#E63872;border-color:#E63872}
.th .rw{display:flex;gap:3px;align-items:center}
.th .rw b{width:6px;height:6px;border:1.5px solid #E63872;border-radius:2px;flex:none}
.th .rw b.f{background:#E63872}
.th .rw b.r{border-radius:50%}
.th s{display:block;flex:1;height:3px;background:#F3C7D4;border-radius:2px;text-decoration:none}
.th .bd>s{flex:none}
.th .cv{flex:1;background:#E63872;border-radius:3px;display:block}
.th .ph{flex:1;border-radius:3px;display:block;background:linear-gradient(160deg,#FFD6E3 0 45%,#F3A9C1 45% 60%,#E63872 60%)}
.th .bb{display:block;height:9px;width:72%;background:#FFD6E3;border-radius:5px;flex:none}
.th .bb.r{align-self:flex-end;background:#E63872}
.th .pl{display:block;width:24px;height:24px;border-radius:50%;border:3px solid #F7CFDC;background:#fff;margin:2px auto;flex:none}
.th .br{display:flex;align-items:flex-end;gap:3px;flex:1}
.th .br i{flex:1;background:#E63872;border-radius:2px 2px 0 0}
.th .br i:nth-child(even){background:#F3C7D4}
.th .sh2{display:flex;gap:3px;align-items:center;justify-content:center;flex:1;flex-wrap:wrap}
.th .sh2 i{width:12px;height:12px;border-radius:50%;background:#E63872}
.th .sh2 i:nth-child(2){border-radius:3px;background:#F3C7D4}
.th .sh2 i:nth-child(3){background:#FFB3CB}
.th .sh2 i:nth-child(4){border-radius:3px}
.th .ics{display:flex;gap:4px;align-items:center;justify-content:center;flex:1}
.th .ics i{width:13px;height:13px;border-radius:4px;border:2px solid #E63872}
.th .ics i:nth-child(2){border-radius:50%}
#custom{display:none;margin-top:8px}
.sw{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 5px;border:3px solid #fff;box-shadow:0 0 0 1.5px #E8D9DE}
.go{width:100%;margin-top:20px;background:linear-gradient(135deg,#E63872,#E4537C);color:#fff;border:0;border-radius:18px;padding:17px;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(230,56,114,.3)}
.err{display:none;background:#fff;border:1px solid #F7CFDC;color:#c0244f;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;text-align:center}
#load{display:none;text-align:center;padding:70px 10px}
.spin{width:54px;height:54px;border:5px solid #F7CFDC;border-top-color:#E63872;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#load b{font-size:18px;display:block}#load span{color:#9a7580;font-size:14px}
#res{display:none}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 10px}
.b1,.b2,.b3{font-family:inherit;font-weight:900;font-size:15px;padding:13px 6px;border-radius:16px;cursor:pointer;border:0}
.b1{background:#E63872;color:#fff}.b3{background:#311118;color:#fff}.b2{background:#fff;color:#E63872;border:2px solid #F7CFDC}
.b1:disabled,.b3:disabled{opacity:.55}
.done{text-align:center;font-size:17px;font-weight:700;margin-bottom:6px}
.hint2{text-align:center;color:#7a5560;font-size:12.5px;margin:0 0 12px}
#imgst{display:none;align-items:center;justify-content:center;gap:8px;color:#E63872;font-weight:700;font-size:13.5px;margin:0 0 12px}
#imgst .sp{width:16px;height:16px;border:3px solid #F7CFDC;border-top-color:#E63872;border-radius:50%;animation:r 1s linear infinite}
#pv{overflow:hidden;border-radius:14px;box-shadow:0 14px 40px rgba(49,17,24,.14);background:#fff}
#pvin{transform-origin:top right;width:794px}
/* ===== المستند ===== */
#paper{width:794px;background:#fff;color:#2a1a1f;font-family:Cairo,sans-serif}
.dcv{height:1123px;position:relative;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);color:#fff;padding:72px 64px 48px;overflow:hidden}
.dcv .o1,.dcv .o2{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.dcv .o1{width:460px;height:460px;top:-150px;left:-170px}
.dcv .o2{width:300px;height:300px;bottom:-90px;right:-110px}
.dcv .kd{position:relative;align-self:flex-start;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:6px 18px;border-radius:30px;font-size:17px;font-weight:700}
.dcv h1{position:relative;font-size:56px;font-weight:900;line-height:1.3;margin:30px 0 14px}
.dcv .st{position:relative;font-size:24px;line-height:1.7;opacity:.93;max-width:620px}
.dcv .ln{position:relative;width:90px;height:5px;border-radius:5px;background:var(--ln);margin-top:26px}
.dcv .cimg{position:relative;margin-top:40px;border-radius:26px;overflow:hidden;height:390px;box-shadow:0 22px 50px rgba(0,0,0,.25);background:rgba(255,255,255,.14)}
.dcv .cimg img{width:100%;height:100%;object-fit:cover;display:block}
.dcv .art{position:relative;margin:auto;width:290px;height:290px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.dcv .art:after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px dashed rgba(255,255,255,.3)}
.dcv .cf{position:relative;margin-top:auto;display:flex;justify-content:space-between;font-size:19px;font-weight:700;opacity:.92;border-top:1px solid rgba(255,255,255,.3);padding-top:18px}
.dcv .cimg~.cf{margin-top:auto}
.dbd{padding:60px 64px 46px}
.toc{background:var(--s1);border-radius:20px;padding:24px 28px;margin-bottom:36px;border:1.5px solid var(--ln)}
.toc h2{font-size:25px;font-weight:900;color:var(--c1);margin-bottom:10px}
.toc li{list-style:none;display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:18.5px;font-weight:600}
.toc li:last-child{border-bottom:0}
.toc li b{color:var(--c1);min-width:24px}
.h2{display:flex;align-items:center;gap:12px;font-size:29px;font-weight:900;color:#311118;margin-bottom:12px}
.ic{width:42px;height:42px;border-radius:13px;background:var(--c1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.intro{border-right:5px solid var(--c1);padding-right:20px;margin-bottom:38px}
.intro p,.concl p{font-size:20px;line-height:1.95;color:#4a3a40}
.sec{margin-bottom:34px;padding-top:8px;break-inside:avoid}
.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.sh .si{width:48px;height:48px;border-radius:15px;background:var(--s1);color:var(--c1);flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.sh .si i{position:absolute;top:-7px;left:-7px;background:var(--c1);color:#fff;font-style:normal;font-size:11.5px;font-weight:900;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.sh h3{font-size:27px;font-weight:900;color:#311118;line-height:1.4}
.sh .sub{font-size:17.5px;color:var(--c1);font-weight:700;margin-top:3px;line-height:1.6}
.sec .p{font-size:19px;line-height:1.9;color:#555;margin:0 0 10px}
.it{display:flex;gap:12px;align-items:flex-start;font-size:19px;line-height:1.8;padding:7px 2px;border-bottom:1px dashed var(--ln)}
.it:last-child{border-bottom:0}
.box{width:21px;height:21px;border:2px solid var(--c1);border-radius:6px;flex-shrink:0;margin-top:8px}
.dot{width:9px;height:9px;background:var(--c1);border-radius:50%;flex-shrink:0;margin-top:15px}
.fig{margin:4px 0 34px;border-radius:22px;overflow:hidden;height:300px;break-inside:avoid;background:var(--s1);position:relative}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.ld{background:linear-gradient(90deg,var(--s1) 25%,var(--ln) 50%,var(--s1) 75%);background-size:200% 100%;animation:shm 1.3s infinite;display:flex;align-items:center;justify-content:center;color:var(--c1);font-weight:700;font-size:15px}
@keyframes shm{to{background-position:-200% 0}}
.tw{margin:0 0 36px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:17px;border:1.5px solid var(--ln);border-radius:16px;overflow:hidden}
th{background:var(--c1);color:#fff;padding:12px 10px;font-weight:900;text-align:right}
td{padding:11px 10px;border-top:1px solid var(--ln);vertical-align:top;line-height:1.6;height:40px}
tr:nth-child(even) td{background:var(--s2)}
.concl{background:var(--s2);border-radius:22px;padding:26px 28px;margin-top:6px;break-inside:avoid}
.tip{display:flex;gap:12px;align-items:flex-start;background:#FFF7E8;border-radius:18px;padding:18px 20px;font-size:18.5px;line-height:1.85;margin-top:18px;break-inside:avoid}
.tip .ic{background:#F2B544;width:36px;height:36px;border-radius:11px}
.endb{margin-top:40px;padding-top:16px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;color:#9a7580;font-size:13px;font-weight:700}
.course{margin-top:26px;background:#fff;border-radius:20px;padding:18px;text-align:center;border:2px solid var(--ln)}
.course b{font-size:17px;display:block;margin-bottom:4px}.course p{font-size:14px;color:#7a5560;margin-bottom:12px}
.course a{display:inline-block;background:#311118;color:#fff;text-decoration:none;font-weight:900;padding:12px 26px;border-radius:30px;font-size:15px}
.foot{text-align:center;color:#b08e98;font-size:12px;margin-top:22px}
.wt .dcv{background:#fff;color:#311118;border:2px solid #EEEEEE}
.wt .dcv .o1,.wt .dcv .o2{background:rgba(0,0,0,.035)}
.wt .dcv .kd{background:#F4F4F4;border-color:#E2E2E2;color:#444}
.wt .dcv .ln{background:#311118}
.wt .dcv .art{background:#F7F7F7;border-color:#E6E6E6;color:#444}
.wt .dcv .art:after{border-color:rgba(0,0,0,.12)}
.wt .dcv .cf{border-top-color:rgba(0,0,0,.12)}
/* ===== خط أكبر ===== */
.top h1{font-size:30px}.top .tag{font-size:18px}label{font-size:17.5px}label small{font-size:13.5px}
input,textarea{font-size:18px}.chip{font-size:16px}.go{font-size:21px}.b1,.b2,.b3{font-size:17px}.done{font-size:19px}
.toc h2{font-size:28px}.toc li{font-size:21.5px}.h2{font-size:32px}.intro p,.concl p{font-size:23px}
.sh h3{font-size:31px}.sh .sub{font-size:20px}.sec .p{font-size:22px}.it{font-size:22px}
.box{width:23px;height:23px;margin-top:9px}.dot{width:10px;height:10px;margin-top:17px}
table{font-size:19.5px}.tip{font-size:21px}.dcv h1{font-size:60px}.dcv .st{font-size:26px}
.keep{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid #F7CFDC;border-radius:16px;padding:10px 14px;margin:0 0 14px;font-size:15px;font-weight:700}.keep span{direction:ltr;unicode-bidi:isolate;display:inline-block;max-width:100%;color:#E63872;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.keep button{font-family:inherit;font-weight:900;font-size:15px;border:0;border-radius:12px;background:#E63872;color:#fff;padding:8px 14px;cursor:pointer;flex:none}
@media print{.keep{display:none!important}}
@media (max-width:360px){.c3{grid-template-columns:1fr 1fr}}
@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
body{background:#fff}.wrap{max-width:none;padding:0}
#keep,#form,#load,.acts,.done,.hint2,#imgst,.course,.foot,.top{display:none!important}
#pv{box-shadow:none;border-radius:0;overflow:visible;height:auto!important}
#pvin{transform:none!important;width:794px}#paper{width:794px}
.dcv{height:296mm;break-after:page;page-break-after:always}
.dbd{padding:0 64px}
.sec,.it,tr,.fig,.tip,.concl,.toc,.intro{break-inside:avoid;page-break-inside:avoid}
@page{size:A4;margin:16mm 0 18mm;@bottom-center{content:counter(page);font-family:Cairo,sans-serif;font-size:10pt;color:#9a7580}}
@page :first{margin:0;@bottom-center{content:none}}
}
</style></head><body><div class="wrap">
<div class="top"><span class="pill">هدية ورشة مجلس سيدات أعمال أبوظبي</span><h1>سوّي ملفج الرقمي<br>بضغطة زر</h1><p class="tag">اكتب فكرتك، ودعنا نحولها إلى ملف رقمي جميل خلال ثوانٍ!</p></div>

<div class="keep" id="keep"><div>احفظي رابط المولد عندج 💗<br><span id="kurl"></span></div><button type="button" id="kcp">انسخي</button></div>
<div class="card" id="form">
<label><i>1</i>شو هو الموضوع؟</label>
<input type="text" id="topic" maxlength="120" placeholder="مثال: تنظيم المطبخ">
<label><i>2</i>اسم التاجر أو المشروع <small>(يطلع على الملف، اختياري)</small></label>
<input type="text" id="brand" maxlength="40" placeholder="مثال: متجر ريم">
<label><i>3</i>إضافات تبينها في الموضوع <small>(اختياري)</small></label>
<textarea id="extra" maxlength="300" placeholder="مثال: يكون للأمهات العاملات، وفيه قسم عن الوجبات السريعة"></textarea>
<label><i>4</i>كم صفحة تبينها؟</label>
<div class="chips c3" id="pages"><button type="button" class="chip on" data-v="1">صفحة</button><button type="button" class="chip" data-v="3">3 صفحات</button><button type="button" class="chip" data-v="5">5 صفحات</button><button type="button" class="chip" data-v="10">10 صفحات</button><button type="button" class="chip" data-v="20">20 صفحة</button><button type="button" class="chip" data-v="30">30 صفحة</button></div>
<label><i>5</i>لون الملف</label>
<div class="chips c3" id="cols"><button type="button" class="chip on" data-v="pink"><span class="sw" style="background:#E63872"></span>وردي</button><button type="button" class="chip" data-v="navy"><span class="sw" style="background:#2B4C7E"></span>كحلي</button><button type="button" class="chip" data-v="green"><span class="sw" style="background:#3E7C59"></span>أخضر</button><button type="button" class="chip" data-v="gold"><span class="sw" style="background:#B08433"></span>ذهبي</button><button type="button" class="chip" data-v="purple"><span class="sw" style="background:#6B4C9A"></span>بنفسجي</button><button type="button" class="chip" data-v="black"><span class="sw" style="background:#333333"></span>أسود</button><button type="button" class="chip" data-v="white"><span class="sw" style="background:#ffffff;box-shadow:0 0 0 1.5px #CFCFCF"></span>أبيض</button></div>
<button class="go" id="go">سوّي الملف مجاناً</button>
<div class="err" id="err"></div>
</div>

<div id="load"><div class="spin"></div><b id="lt">جاري تجهيز ملفج...</b><span id="ls">تقريباً 20 ثانية</span></div>

<div id="res">
<div class="done">ملفج جاهز</div>
<div class="acts"><button class="b1" id="dl">حفظ PDF</button><button class="b3" id="dlw">حفظ وورد</button><button class="b2" id="again">ملف ثاني</button></div>
<div id="imgst"><span class="sp"></span><span id="imgtx">نجهز الصور المناسبة لملفج...</span></div>
<div id="pv"><div id="pvin"><div id="paper"></div></div></div>
</div>
</div>
<script>
function $(i){return document.getElementById(i)}
var pages='1',typ='custom',withImg=false,last=null,BR='',COL='pink';
var PALS={pink:['E63872','C92A62','8E1F47','FFF0F5','FAF1ED','F7CFDC'],navy:['2B4C7E','22406B','16263F','EEF3FA','F3F5F9','CBD8EA'],green:['3E7C59','336A4B','1F3D2C','EEF6F1','F4F7F3','CFE3D6'],gold:['B08433','96702A','5B4317','FBF5E8','F8F4EC','EBDDBB'],purple:['6B4C9A','5A3F84','35244F','F3EFF9','F6F4FA','DCD2EC'],black:['333333','222222','111111','F3F3F3','F6F6F6','DDDDDD'],white:['4A4A4A','3A3A3A','2A2A2A','F5F5F5','FAFAFA','E6E6E6']};
function PAL(){return PALS[COL]||PALS.pink}
function setVars(el){var p=PAL(),n=['c1','c2','c3','s1','s2','ln'];for(var i=0;i<6;i++)el.style.setProperty('--'+n[i],'#'+p[i]);el.classList.toggle('wt',COL=='white')}
var HD='<span class="hd"></span>';
function cells(n,on,c){var s='<span class="g'+(c==4?' g4':'')+'">';for(var i=0;i<n;i++)s+='<i'+(on.indexOf(i)>-1?' class="on"':'')+'></i>';return s+'</span>'}
function rw(cls){return '<span class="rw"><b class="'+cls+'"></b><s></s></span>'}
var TH={
planner:HD+'<span class="bd">'+cells(12,[1,6],3)+'</span>',
checklist:HD+'<span class="bd">'+rw('f')+rw('f')+rw('')+rw('')+'</span>',
tracker:HD+'<span class="bd">'+cells(16,[1,2,5,10,11,14],4)+'</span>',
ebook:'<span class="bd"><span class="cv"></span><s></s><s></s></span>',
worksheet:HD+'<span class="bd">'+rw('r')+rw('r')+rw('r')+rw('r')+'</span>',
templates:'<span class="bd"><span class="bb"></span><span class="bb r"></span><span class="bb" style="width:50%"></span><span class="bb r" style="width:60%"></span></span>',
recipes:'<span class="bd"><span class="pl"></span><s></s><s></s></span>',
budget:HD+'<span class="bd"><span class="br"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></span></span>',
kids:'<span class="bd"><span class="sh2"><i></i><i></i><i></i><i></i></span></span>',
custom:'<span class="bd"><span class="pl" style="border:2px dashed #E63872;display:flex;align-items:center;justify-content:center;color:#E63872;font-weight:900;font-size:16px;margin:auto">+</span></span>',
